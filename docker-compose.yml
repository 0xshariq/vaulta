version: '3.8'

services:
  vaulta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vaulta-password-manager
    volumes:
      # Mount vaults directory for persistent storage
      - ./vaults:/app/vaults
      # Mount SSH keys for Git operations (read-only)
      - ~/.ssh:/home/vaulta/.ssh:ro
      # Mount GPG keys if using GPG encryption
      - ~/.gnupg:/home/vaulta/.gnupg:ro
    environment:
      - RUST_LOG=info
      - vaulta_VAULT_PATH=/app/vaults
      - vaulta_SESSION_TIMEOUT=86400
      - vaulta_CLIPBOARD_TIMEOUT=45
    working_dir: /app
    # Use host networking for clipboard access (Linux/macOS)
    network_mode: host
    # Restart policy for production
    restart: unless-stopped
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'
    # Health check
    healthcheck:
      test: ["CMD", "vaulta", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Labels for organization
    labels:
      - "com.vaulta.description=Secure Password Manager"
      - "com.vaulta.version=1.0.0"
      - "com.vaulta.maintainer=your-email@example.com"

  # Optional: Development service with hot reload
  vaulta-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: vaulta-dev
    volumes:
      - ./vaults:/app/vaults
      - ./src:/app/src
      - ~/.ssh:/home/vaulta/.ssh:ro
    environment:
      - RUST_LOG=debug
      - vaulta_VAULT_PATH=/app/vaults
    working_dir: /app
    command: ["sh", "-c", "cargo watch -x run"]
    profiles:
      - dev

volumes:
  vaulta-vaults:
    driver: local

networks:
  default:
    name: vaulta-network
    driver: bridge
